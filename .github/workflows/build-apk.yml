name: Build APK

on:
  push:
    branches: [main, claude/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (artifact, connexion GitHub requise)
        uses: actions/upload-artifact@v4
        with:
          name: geoquiz-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier/mettre à jour la Release publique (lien sans connexion)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: GeoQuiz — dernière version
          body: |
            APK généré automatiquement à partir du dernier commit (${{ github.sha }}).
            Télécharge `app-release.apk` ci-dessous et installe-le sur Android
            (active "Installer des applications inconnues" si demandé).
          make_latest: false
          files: build/app/outputs/flutter-apk/app-release.apk
